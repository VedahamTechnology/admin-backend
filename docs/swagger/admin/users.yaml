tags:
  - name: Admin Users
    description: User management for admins

paths:
  /api/admin/users:
    get:
      summary: Get all users
      tags: [Admin Users]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, vendor, admin]
      responses:
        200:
          description: Success

  /api/admin/users/search:
    get:
      summary: Search users
      tags: [Admin Users]
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Success

  /api/admin/users/analytics:
    get:
      summary: Get user analytics
      tags: [Admin Users]
      responses:
        200:
          description: Success

  /api/admin/users/{id}:
    get:
      summary: Get user by ID
      tags: [Admin Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
    delete:
      summary: Delete a user
      tags: [Admin Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted

  /api/admin/users/{id}/block:
    put:
      summary: Block a user
      tags: [Admin Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User blocked

  /api/admin/users/{id}/unblock:
    put:
      summary: Unblock a user
      tags: [Admin Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User unblocked
