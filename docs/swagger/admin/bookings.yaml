tags:
  - name: Admin Bookings
    description: Booking management for admins

paths:
  /api/admin/bookings/recent:
    get:
      summary: Get recent bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Success

  /api/admin/bookings/pending:
    get:
      summary: Get pending bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/confirmed:
    get:
      summary: Get confirmed bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/completed:
    get:
      summary: Get completed bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: customerId
          schema:
            type: string
        - in: query
          name: vendorId
          schema:
            type: string
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/cancelled:
    get:
      summary: Get cancelled bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/stats:
    get:
      summary: Get booking statistics and analytics
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/search:
    get:
      summary: Search bookings
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: search
          required: true
          schema:
            type: string
        - in: query
          name: field
          schema:
            type: string
            enum: [id, customerEmail, vendorName]
            default: id
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: city_id
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings:
    get:
      summary: Get all bookings with filtering and pagination
      tags: [Admin Bookings]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
        - in: query
          name: vendorId
          schema:
            type: string
        - in: query
          name: customerId
          schema:
            type: string
        - in: query
          name: city_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        200:
          description: Success

  /api/admin/bookings/{id}:
    get:
      summary: Get specific booking details
      tags: [Admin Bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success

  /api/admin/bookings/{id}/status:
    patch:
      summary: Update booking status
      tags: [Admin Bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, completed, cancelled]
                reason:
                  type: string
      responses:
        200:
          description: Status updated

  /api/admin/bookings/{id}/complete:
    put:
      summary: Admin manually complete a booking
      tags: [Admin Bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Booking completed

  /api/admin/bookings/{id}/cancel:
    put:
      summary: Admin cancel a booking
      tags: [Admin Bookings]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                refundAmount:
                  type: number
      responses:
        200:
          description: Booking cancelled
