tags:
  - name: Catalog
    description: Public catalog for categories and brands

paths:
  /api/catalog/categories:
    get:
      summary: Get all catalog categories
      tags: [Catalog]
      parameters:
        - in: query
          name: isActive
          schema:
            type: string
            enum: ['true', 'false', 'all']
            default: 'true'
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        200:
          description: Success

  /api/catalog/brands:
    get:
      summary: Get all catalog brands
      tags: [Catalog]
      parameters:
        - in: query
          name: city_id
          required: true
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        200:
          description: Success

  /api/catalog/brands/{id}/services:
    get:
      summary: Get services for a specific brand
      tags: [Catalog]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: city_id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        200:
          description: Success
