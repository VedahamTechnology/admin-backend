tags:
  - name: User Bookings
    description: Customer booking management

paths:
  /api/user/bookings:
    post:
      summary: Create a new booking
      tags: [User Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - serviceId
                - vendorId
                - bookingDate
                - timeSlot
                - serviceAddress
              properties:
                serviceId:
                  type: string
                vendorId:
                  type: string
                bookingDate:
                  type: string
                  format: date
                timeSlot:
                  type: object
                  required: [startTime, endTime]
                  properties:
                    startTime:
                      type: string
                    endTime:
                      type: string
                serviceAddress:
                  type: object
                  required: [street, city, latitude, longitude]
                  properties:
                    label:
                      type: string
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    pincode:
                      type: string
                    latitude:
                      type: number
                    longitude:
                      type: number
                    instructions:
                      type: string
                paymentMethod:
                  type: string
                  enum: [cash, online]
                customerNotes:
                  type: string
      responses:
        201:
          description: Booking created successfully
    get:
      summary: Get all bookings for the logged-in user
      tags: [User Bookings]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, on_the_way, in_progress, completed, cancelled]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            default: createdAt
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        200:
          description: List of user bookings

  /api/user/bookings/stats:
    get:
      summary: Get booking statistics for user
      tags: [User Bookings]
      responses:
        200:
          description: Success

  /api/user/bookings/search:
    get:
      summary: Search user's bookings
      tags: [User Bookings]
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Success

  /api/user/bookings/vendor/{vendorId}/availability:
    get:
      summary: Get vendor availability for a specific date
      tags: [User Bookings]
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        200:
          description: Success

  /api/user/bookings/{bookingId}:
    get:
      summary: Get details of a specific booking
      tags: [User Bookings]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Booking details

  /api/user/bookings/{bookingId}/cancel:
    patch:
      summary: Cancel a booking
      tags: [User Bookings]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        200:
          description: Booking cancelled

  /api/user/bookings/{bookingId}/reschedule:
    patch:
      summary: Reschedule a booking
      tags: [User Bookings]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingDate, timeSlot]
              properties:
                bookingDate:
                  type: string
                  format: date
                timeSlot:
                  type: object
                  required: [startTime, endTime]
                  properties:
                    startTime:
                      type: string
                    endTime:
                      type: string
                reason:
                  type: string
      responses:
        200:
          description: Success

  /api/user/bookings/{bookingId}/review:
    post:
      summary: Create a review for a booking
      tags: [User Bookings]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        201:
          description: Success
