tags:
  - name: User Services
    description: Customer service discovery APIs

paths:
  /api/user/services:
    get:
      summary: Get all services with location filtering
      tags: [User Services]
      parameters:
        - in: query
          name: city_id
          required: true
          schema:
            type: string
        - in: query
          name: latitude
          schema: { type: number }
        - in: query
          name: longitude
          schema: { type: number }
        - in: query
          name: radius
          schema: { type: number, default: 10 }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: sortBy
          schema: { type: string, default: createdAt }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
      responses:
        200:
          description: List of services

  /api/user/services/categories:
    get:
      summary: Get all service categories
      tags: [User Services]
      responses:
        200:
          description: List of categories

  /api/user/services/search:
    get:
      summary: Search for services
      tags: [User Services]
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string }
      responses:
        200:
          description: Search results

  /api/user/services/top-rated:
    get:
      summary: Get top rated services
      tags: [User Services]
      responses:
        200:
          description: List of top rated services

  /api/user/services/category/{categoryId}:
    get:
      summary: Get services by category
      tags: [User Services]
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Services in category

  /api/user/services/{serviceId}:
    get:
      summary: Get specific service details
      tags: [User Services]
      parameters:
        - in: path
          name: serviceId
          required: true
          schema: { type: string }
      responses:
        200:
          description: Service details
